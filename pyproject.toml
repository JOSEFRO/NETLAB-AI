[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netlab-ai"
version = "0.1.0"
description = "Asistente de laboratorios de redes con Cisco Packet Tracer y MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.13,<2", "PyMuPDF>=1.24", "python-docx>=1.1", "Pillow>=10", "reportlab>=4.2", "PyYAML>=6.0"]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
netlab-ai = "netlab_ai.__main__:main"

[tool.setuptools.packages.find]
include = ["netlab_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
